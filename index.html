                    ctx.fillText(
                        "Infinite procedural rock tunnel.",
                        eMidX,
                        eTopY + 62,
                    );
                    ctx.fillText(
                        "Chain blasts as deep as you can.",
                        eMidX,
                        eTopY + 80,
                    );

                    ctx.font =
                        '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle =
                        sessionBestEndlessMeters > 0 ? "#4ade80" : "#64748b";
                    ctx.fillText(
                        sessionBestEndlessMeters > 0
                            ? `SESSION BEST: ${sessionBestEndlessMeters}m`
                            : "TAP OR PRESS [2] TO LAUNCH",
                        eMidX,
                        eTopY + endlessCardRect.h - 22,
                    );

                    // Footer controls hint
                    const footerY = isWide
                        ? cy + 138
                        : endlessCardRect.y + cardH + 28;
                    ctx.font =
                        '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = "#64748b";
                    ctx.fillText(
                        "HOLD CLICK / TOUCH / SPACE TO FIRE THRUSTER  •  UNIQUE SEED EVERY MAP",
                        cx,
                        footerY,
                    );

                    ctx.restore();
                }

                function renderClearedOverlay() {
                    if (gameState !== "CLEARED") return;
                    ctx.save();
                    ctx.fillStyle = "rgba(9, 13, 21, 0.68)";
                    ctx.fillRect(0, 0, screenW, screenH);

                    const cx = screenW * 0.5;
                    const cy = screenH * 0.5;

                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.font =
                        '800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = "#4ade80";
                    ctx.fillText("TUNNEL CLEARED", cx, cy - 44);

                    ctx.font =
                        '600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = "#f8fafc";
                    ctx.fillText(`ATTEMPTS USED: ${attemptCount}`, cx, cy + 2);

                    ctx.font =
                        '600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = "#7ce2ff";
                    ctx.fillText(
                        `SESSION BEST: ${sessionBestClassicAttempts}`,
                        cx,
                        cy + 32,
                    );

                    ctx.font =
                        '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = "#94a3b8";
                    ctx.fillText(
                        "GENERATING NEW RANDOM TUNNEL...",
                        cx,
                        cy + 68,
                    );

                    ctx.restore();
                }

                function renderFrame(frameDt) {
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    const scale = Math.min(
                        screenH / WORLD_HEIGHT,
                        screenW / 660,
                    );
                    const viewWorldW = screenW / scale;
                    const offsetY = (screenH - WORLD_HEIGHT * scale) * 0.5;

                    // Smooth camera follow (slow ambient pan while on Main Menu)
                    if (gameState === "MENU") {
                        camX = (performance.now() * 0.035) % 900;
                    } else {
                        const maxCamX =
                            gameMode === "CLASSIC"
                                ? Math.max(0, CLASSIC_WORLD_WIDTH - viewWorldW)
                                : 0x7fffffff;
                        const targetCamX = Math.max(
                            0,
                            Math.min(maxCamX, rocket.x - viewWorldW * 0.28),
                        );
                        camX +=
                            (targetCamX - camX) * (1 - Math.exp(-10 * frameDt));
                    }

                    if (shakeMag > 0.1) {
                        shakeX = (Math.random() - 0.5) * 2 * shakeMag;
                        shakeY = (Math.random() - 0.5) * 2 * shakeMag;
                        shakeMag *= Math.exp(-14 * frameDt);
                    } else {
                        shakeMag = 0;
                        shakeX = 0;
                        shakeY = 0;
                    }

                    ctx.fillStyle = "#121722";
                    ctx.fillRect(0, 0, screenW, screenH);

                    ctx.save();
                    ctx.translate(shakeX, offsetY + shakeY);
                    ctx.scale(scale, scale);

                    const bgGrad = ctx.createLinearGradient(
                        0,
                        0,
                        0,
                        WORLD_HEIGHT,
                    );
                    bgGrad.addColorStop(0, "#070a10");
                    bgGrad.addColorStop(0.5, "#0d131f");
                    bgGrad.addColorStop(1, "#070a10");
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, viewWorldW, WORLD_HEIGHT);

                    ctx.fillStyle = "rgba(22, 30, 46, 0.55)";
                    const parallaxOffset = -(camX * 0.35) % 180;
                    for (
                        let px = parallaxOffset - 180;
                        px < viewWorldW + 180;
                        px += 180
                    ) {
                        ctx.fillRect(px, 0, 52, WORLD_HEIGHT);
                    }

                    ctx.translate(-camX, 0);

                    const minVisibleX = camX;
                    const maxVisibleX = camX + viewWorldW;

                    renderWorldProps(minVisibleX, maxVisibleX);

                    // Draw only visible terrain chunks
                    const firstChunk = Math.max(
                        0,
                        Math.floor(minVisibleX / (CHUNK_W * CELL_SIZE)),
                    );
                    const lastChunk = Math.ceil(
                        maxVisibleX / (CHUNK_W * CELL_SIZE),
                    );

                    for (let c = firstChunk; c <= lastChunk; c++) {
                        if (
                            gameMode === "CLASSIC" &&
                            c * CHUNK_W >= CLASSIC_MAX_GX
                        )
                            break;
                        const chunk = ensureChunkRendered(c);
                        if (!chunk) continue;
                        const dstX = c * CHUNK_W * CELL_SIZE;
                        const dstW = CHUNK_W * CELL_SIZE;
                        ctx.drawImage(
                            chunk.activeCanvas,
                            0,
                            0,
                            CHUNK_CANVAS_W,
                            CHUNK_CANVAS_H,
                            dstX,
                            0,
                            dstW,
                            WORLD_HEIGHT,
                        );
                    }

                    if (gameState !== "MENU") {
                        renderGhosts(minVisibleX, maxVisibleX);
                    }

                    if (gameState === "PLAYING" || gameState === "CLEARED") {
                        drawRocketShape(
                            rocket.x,
                            rocket.y,
                            rocket.angle,
                            rocket.thrust,
                            false,
                            1.0,
                            false,
                        );
                    }

                    renderParticles(minVisibleX, maxVisibleX);

                    ctx.restore();

                    renderHUD();
                    if (gameState === "MENU") {
                        renderMainMenuOverlay();
                    } else if (gameState === "CLEARED") {
                        renderClearedOverlay();
                    }
                }

                // ============================================================================
                // INPUT HANDLING & VISIBILITY PAUSE
                // ============================================================================
                function handlePressStart() {
                    sound.init();
                    if (gameState === "CLEARED" && stateTimer < 1.9) {
                        inputHeld = true;
                        startNewMap("CLASSIC", generateSessionSeed());
                        return;
                    }
                    if (gameState === "PLAYING" || gameState === "DEAD") {
                        inputHeld = true;
                    }
                }

                function handlePressEnd() {
                    inputHeld = false;
                }

                canvas.addEventListener(
                    "pointerdown",
                    (e) => {
                        e.preventDefault();
                        sound.init();

                        const rect = canvas.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        // Mute toggle button
                        if (pointInRect(x, y, muteBtnRect)) {
                            sound.toggleMute();
                            return;
                        }

                        // Main Menu mode selection cards
                        if (gameState === "MENU") {
                            if (pointInRect(x, y, classicCardRect)) {
                                sound.playClick();
                                startNewMap("CLASSIC", generateSessionSeed());
                                return;
                            }
                            if (pointInRect(x, y, endlessCardRect)) {
                                sound.playClick();
                                startNewMap("ENDLESS", generateSessionSeed());
                                return;
                            }
                            return;
                        }

                        // In-game MENU and NEW MAP buttons
                        if (pointInRect(x, y, menuBtnRect)) {
                            sound.playClick();
                            openMainMenu();
                            return;
                        }
                        if (pointInRect(x, y, newMapBtnRect)) {
                            sound.playClick();
                            startNewMap(gameMode, generateSessionSeed());
                            return;
                        }

                        handlePressStart();
                    },
                    { passive: false },
                );

                window.addEventListener(
                    "pointerup",
                    (e) => {
                        e.preventDefault();
                        handlePressEnd();
                    },
                    { passive: false },
                );

                window.addEventListener("pointercancel", () => {
                    handlePressEnd();
                });

                window.addEventListener("keydown", (e) => {
                    if (gameState === "MENU") {
                        if (
                            e.code === "Digit1" ||
                            e.code === "Space" ||
                            e.code === "Enter"
                        ) {
                            e.preventDefault();
                            sound.init();
                            sound.playClick();
                            startNewMap("CLASSIC", generateSessionSeed());
                        } else if (e.code === "Digit2") {
                            e.preventDefault();
                            sound.init();
                            sound.playClick();
                            startNewMap("ENDLESS", generateSessionSeed());
                        } else if (e.code === "KeyM") {
                            sound.toggleMute();
                        }
                        return;
                    }

                    if (e.code === "Space") {
                        e.preventDefault();
                        if (!e.repeat) handlePressStart();
                    } else if (e.code === "Escape") {
                        e.preventDefault();
                        sound.playClick();
                        openMainMenu();
                    } else if (e.code === "KeyR") {
                        e.preventDefault();
                        sound.playClick();
                        startNewMap(gameMode, generateSessionSeed());
                    } else if (e.code === "KeyM") {
                        sound.toggleMute();
                    }
                });

                window.addEventListener("keyup", (e) => {
                    if (e.code === "Space") {
                        e.preventDefault();
                        handlePressEnd();
                    }
                });

                document.addEventListener(
                    "touchmove",
                    (e) => e.preventDefault(),
                    { passive: false },
                );

                document.addEventListener("visibilitychange", () => {
                    if (document.hidden) {
                        paused = true;
                        inputHeld = false;
                        sound.setThrust(0);
                    } else {
                        paused = false;
                        lastFrameTime = performance.now();
                    }
                });

                // ============================================================================
                // MAIN LOOP (FIXED-TIMESTEP 120 HZ ACCUMULATOR)
                // ============================================================================
                openMainMenu();

                let lastFrameTime = performance.now();

                function loop(now) {
                    requestAnimationFrame(loop);
                    if (paused) return;

                    let frameDt = (now - lastFrameTime) / 1000;
                    lastFrameTime = now;
                    if (frameDt > 0.1) frameDt = 0.1;

                    if (gameState === "PLAYING" || gameState === "DEAD") {
                        accumulator += frameDt;
                        while (accumulator >= FIXED_DT) {
                            stepPhysicsTick();
                            accumulator -= FIXED_DT;
                        }
                    }

                    if (gameState === "DEAD") {
                        stateTimer -= frameDt;
                        if (stateTimer <= 0) {
                            attemptCount++;
                            startAttempt();
                        }
                    } else if (gameState === "CLEARED") {
                        stateTimer -= frameDt;
                        if (stateTimer <= 0) {
                            startNewMap("CLASSIC", generateSessionSeed());
                        }
                    }

                    updateVisualEffects(frameDt);
                    renderFrame(frameDt);
                }

                requestAnimationFrame(loop);
            })();
        </script>
    </body>
</html>
